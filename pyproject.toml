[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cineplex-seat-preview-crawler"
version = "0.1.0"
description = "Interactive Playwright crawler for documenting Cineplex seat availability."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50,<2",
    "questionary>=2,<3",
]

[project.scripts]
cineplex-crawler = "crawler:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that access the live Cineplex website",
]

[tool.setuptools]
py-modules = ["crawler"]
